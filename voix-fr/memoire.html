<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mémoire du robot</title>
<style>
  :root { --fond:#f5f4f0; --carte:#fff; --texte:#1d1d1b; --doux:#6b6a65; --accent:#2f6f5e; --bord:#dedcd5; --rouge:#b3412f; }
  @media (prefers-color-scheme: dark) { :root { --fond:#161615; --carte:#21211f; --texte:#ecebe6; --doux:#9d9c95; --accent:#6fbfa8; --bord:#34332f; --rouge:#e07a66; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fond); color:var(--texte); font:15px/1.45 system-ui, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; } .sous { color:var(--doux); margin:0 0 18px; }
  .note, .ajout { background:var(--carte); border:1px solid var(--bord); border-radius:12px; padding:12px; margin-bottom:10px; display:grid; gap:8px; }
  input, textarea { width:100%; font:inherit; padding:8px; border:1px solid var(--bord); border-radius:8px; background:var(--fond); color:var(--texte); }
  textarea { min-height:56px; resize:vertical; }
  .bas { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .date { color:var(--doux); font-size:13px; margin-right:auto; }
  button { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.second { background:transparent; color:var(--accent); }
  button.danger { background:transparent; color:var(--rouge); border-color:var(--rouge); }
  #filtre { margin-bottom:14px; }
</style>
</head>
<body>
<main>
  <h1>Mémoire du robot</h1>
  <p class="sous">Ce que le robot a retenu quand tu lui as dit « retiens que… ». Il s'en sert dans ses réponses. Tu peux corriger, ajouter ou supprimer.</p>
  <div class="ajout">
    <input id="n_cle" placeholder="Sujet (ex. : anniversaire de Yannick)">
    <textarea id="n_texte" placeholder="Ce qu'il faut retenir"></textarea>
    <div class="bas"><span class="date"></span><button id="ajouter">Ajouter</button></div>
  </div>
  <input id="filtre" placeholder="Filtrer…">
  <div id="notes"></div>
</main>
<script>
const $ = id => document.getElementById(id);
async function api(methode, corps) {
  const r = await fetch("/memoire/api", { method: methode, headers: {"Content-Type": "application/json"},
                                          body: corps ? JSON.stringify(corps) : undefined });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function charger() {
  const notes = (await api("GET")).reverse();
  const f = $("filtre").value.toLowerCase();
  const box = $("notes"); box.replaceChildren();
  if (!notes.length) { box.textContent = "Aucune note pour l'instant."; return; }
  for (const n of notes) {
    if (f && !(n.cle + " " + n.texte).toLowerCase().includes(f)) continue;
    const d = document.createElement("div"); d.className = "note";
    const cle = document.createElement("input"); cle.value = n.cle;
    const txt = document.createElement("textarea"); txt.value = n.texte;
    const bas = document.createElement("div"); bas.className = "bas";
    const date = document.createElement("span"); date.className = "date"; date.textContent = n.date.replace("T", " à ");
    const ok = document.createElement("button"); ok.className = "second"; ok.textContent = "Enregistrer";
    ok.onclick = async () => {
      if (cle.value.trim() !== n.cle) await api("DELETE", { cle: n.cle });
      await api("POST", { cle: cle.value, texte: txt.value }); charger();
    };
    const sup = document.createElement("button"); sup.className = "danger"; sup.textContent = "Supprimer";
    sup.onclick = async () => { if (confirm("Supprimer « " + n.cle + " » ?")) { await api("DELETE", { cle: n.cle }); charger(); } };
    bas.append(date, ok, sup); d.append(cle, txt, bas); box.append(d);
  }
}
$("ajouter").onclick = async () => {
  if (!$("n_cle").value.trim() || !$("n_texte").value.trim()) return;
  await api("POST", { cle: $("n_cle").value, texte: $("n_texte").value });
  $("n_cle").value = ""; $("n_texte").value = ""; charger();
};
$("filtre").oninput = charger;
charger();
</script>
</body>
</html>
